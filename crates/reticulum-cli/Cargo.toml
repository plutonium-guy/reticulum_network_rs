[package]
name = "reticulum-cli"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = []
serial = ["reticulum-tokio/serial"]

[lib]
name = "reticulum_cli"
path = "src/lib.rs"

[[bin]]
name = "reticulumd"
path = "src/main.rs"

[dependencies]
reticulum-core = { path = "../reticulum-core" }
reticulum-node = { path = "../reticulum-node" }
reticulum-tokio = { path = "../reticulum-tokio" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
serde.workspace = true
toml = "0.8"
hex.workspace = true
zeroize = "1"
if-addrs = { version = "0.14", features = ["link-local"] }

[dev-dependencies]
tempfile = "3"
