<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Reticulum WASM node</title>
    <style>
      body { max-width: 52rem; margin: 3rem auto; padding: 0 1rem; font: 16px/1.5 system-ui; }
      code, pre { background: #f2f4f7; border-radius: .35rem; padding: .2rem .4rem; }
      pre { padding: 1rem; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>Reticulum WASM node</h1>
    <p id="destination">Starting…</p>
    <pre id="status" aria-live="polite"></pre>
    <script type="module">
      import init, { ReticulumNode } from "./pkg/reticulum_wasm.js";

      const query = new URLSearchParams(location.search);
      const bridge = query.get("bridge") || "ws://127.0.0.1:8765";
      const pythonDestination = query.get("python_dest");
      const identity = "11".repeat(32) + "22".repeat(32);
      const evidence = window.__reticulumEvidence = {
        browserDest: null,
        sent: false,
        received: false,
        errors: [],
      };

      function render(message) {
        document.querySelector("#status").textContent += `${message}\n`;
      }

      try {
        await init();
        const node = new ReticulumNode(identity);
        evidence.browserDest = node.register_single_destination("wasm_browser", ["message"]);
        document.querySelector("#destination").textContent =
          `Browser destination: ${evidence.browserDest}`;
        node.setOnMessage((_destination, plaintext) => {
          render(`Received: ${plaintext}`);
          if (plaintext === "hello from python to wasm") evidence.received = true;
        });
        node.setOnDelivered(hash => render(`Delivered: ${hash}`));
        node.connect_ws(bridge);

        const announceAndSend = setInterval(() => {
          try {
            node.announce("browser wasm node");
            if (pythonDestination && !evidence.sent) {
              node.send(pythonDestination, "hello from wasm to python");
              evidence.sent = true;
              render("Sent: hello from wasm to python");
            }
            if (evidence.sent && evidence.received) clearInterval(announceAndSend);
          } catch (error) {
            const message = String(error);
            if (!message.includes("send failed: Unknown")) {
              evidence.errors.push(message);
              render(`Error: ${message}`);
            }
          }
        }, 500);
      } catch (error) {
        evidence.errors.push(String(error));
        render(`Fatal: ${error}`);
      }
    </script>
  </body>
</html>
