name: pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deploy at a time; let a newer push supersede a running one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Build the WASM console
        run: |
          set -euo pipefail
          mkdir -p site
          wasm-pack build crates/reticulum-wasm \
            --target web \
            --out-dir "$GITHUB_WORKSPACE/site/pkg"
          # app.html is the console; serve it at the site root.
          cp tools/wasm/app.html site/index.html
          cp tools/wasm/app.html site/app.html
          cp tools/wasm/README.md site/README.md
          # Do not let GitHub Pages' Jekyll mangle pkg/ (underscored files, .wasm).
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
